<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅行購物清單 App</title>
    
    <!-- PWA / App Standalone Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="旅行購物">
    <meta name="theme-color" content="#ec4899">

    <!-- Web App Manifest Dynamic Link -->
    <link rel="manifest" id="pwaManifest" href="">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap');
        
        :root {
            --accent-color: #ec4899;
            --accent-light: #fce7f3;
            --bg-color: #fff5f7;
            --card-radius: 1.25rem;
            --app-radius: 36px;
            --card-border: 1px solid rgba(251, 207, 232, 0.7);
            --card-shadow: 0 4px 14px rgba(236, 72, 153, 0.06);
            --font-main: 'Quicksand', 'Noto Sans TC', sans-serif;
        }

        /* =========================================
           1. 🌸 可愛軟萌風 (Cute Pastel)
           ========================================= */
        body.style-cute {
            --accent-color: #ec4899;
            --accent-light: #fce7f3;
            --bg-color: #fff5f7;
            --card-radius: 1.35rem;
            --app-radius: 38px;
            --card-border: 1.5px solid #fbcfe8;
            --card-shadow: 0 6px 16px -4px rgba(244, 114, 182, 0.14);
            --font-main: 'Quicksand', 'Noto Sans TC', sans-serif;
        }
        body.style-cute header {
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 55%, #fef3c7 100%);
            border-bottom-left-radius: 34px;
            border-bottom-right-radius: 34px;
        }

        /* =========================================
           2. 📓 手帳剪貼風 (Journal Scrapbook)
           ========================================= */
        body.style-journal {
            --accent-color: #b45309;
            --accent-light: #fef3c7;
            --bg-color: #f4efe6;
            --card-radius: 0.5rem;
            --app-radius: 16px;
            --card-border: 1.5px dashed #c8b69e;
            --card-shadow: 3px 3px 0px rgba(180, 155, 125, 0.25);
            --font-main: 'Noto Serif TC', Georgia, serif;
            background-image: radial-gradient(#d6cbb9 1px, transparent 1px);
            background-size: 16px 16px;
        }
        body.style-journal #app {
            background-color: #fcf9f2 !important;
            border: 2px solid #d6c7b2 !important;
            box-shadow: 8px 8px 0px rgba(168, 149, 124, 0.2) !important;
        }
        body.style-journal header {
            background: #f5ebd9 !important;
            border-bottom: 2px dashed #cbbba4 !important;
            border-radius: 0 !important;
        }
        body.style-journal #itemList > div {
            background-color: #fffdf8 !important;
            position: relative;
        }
        body.style-journal nav {
            background-color: #f7f1e3 !important;
            border-top: 2px dashed #cbbba4 !important;
        }

        /* =========================================
           3. 🖤 雜誌極簡風 (Editorial Minimal)
           ========================================= */
        body.style-minimal {
            --accent-color: #18181b;
            --accent-light: #f4f4f5;
            --bg-color: #fafafa;
            --card-radius: 0.25rem;
            --app-radius: 0px;
            --card-border: 1px solid #e4e4e7;
            --card-shadow: none;
            --font-main: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif;
        }
        body.style-minimal #app {
            background-color: #ffffff !important;
            border: 1px solid #d4d4d8 !important;
            box-shadow: none !important;
        }
        body.style-minimal header {
            background: #ffffff !important;
            border-bottom: 1.5px solid #18181b !important;
            border-radius: 0 !important;
        }
        body.style-minimal #openAddItemModal,
        body.style-minimal button[type="submit"] {
            background: #18181b !important;
            color: #ffffff !important;
            border-radius: 4px !important;
            box-shadow: none !important;
        }
        body.style-minimal nav {
            border-top: 1px solid #18181b !important;
        }

        /* =========================================
           4. 🕹️ 復古潮玩風 (Neo-Brutalism Pop)
           ========================================= */
        body.style-brutal {
            --accent-color: #ea580c;
            --accent-light: #ffedd5;
            --bg-color: #fef08a;
            --card-radius: 0.6rem;
            --app-radius: 18px;
            --card-border: 2px solid #1e293b;
            --card-shadow: 4px 4px 0px #1e293b;
            --font-main: 'JetBrains Mono', 'Noto Sans TC', sans-serif;
        }
        body.style-brutal #app {
            background-color: #fffbeb !important;
            border: 3px solid #1e293b !important;
            box-shadow: 8px 8px 0px #1e293b !important;
        }
        body.style-brutal header {
            background: #fdba74 !important;
            border-bottom: 3px solid #1e293b !important;
            border-radius: 0 !important;
        }
        body.style-brutal #openAddItemModal,
        body.style-brutal button[type="submit"] {
            background: #fb923c !important;
            color: #1e293b !important;
            border: 2px solid #1e293b !important;
            box-shadow: 3px 3px 0px #1e293b !important;
        }
        body.style-brutal nav {
            background-color: #fef3c7 !important;
            border-top: 3px solid #1e293b !important;
        }

        /* =========================================
           5. 🌌 賽博夜光風 (Cyber Neon Dark)
           ========================================= */
        body.style-cyber {
            --accent-color: #38bdf8;
            --accent-light: rgba(56, 189, 248, 0.15);
            --bg-color: #090d16;
            --card-radius: 1rem;
            --app-radius: 28px;
            --card-border: 1px solid rgba(56, 189, 248, 0.35);
            --card-shadow: 0 0 18px rgba(56, 189, 248, 0.12);
            --font-main: 'Quicksand', 'Noto Sans TC', sans-serif;
            color: #e2e8f0;
        }
        body.style-cyber #app {
            background-color: #0f172a !important;
            border: 1px solid rgba(56, 189, 248, 0.4) !important;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15) !important;
        }
        body.style-cyber header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #0c4a6e 100%) !important;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3) !important;
            color: #f8fafc !important;
        }
        body.style-cyber .bg-white,
        body.style-cyber .bg-white\/70,
        body.style-cyber .bg-white\/80,
        body.style-cyber .bg-white\/95 {
            background-color: #162035 !important;
            border-color: rgba(56, 189, 248, 0.25) !important;
            color: #f1f5f9 !important;
        }
        body.style-cyber .bg-orange-50\/50,
        body.style-cyber .bg-orange-50\/60,
        body.style-cyber .bg-orange-50\/70,
        body.style-cyber .bg-orange-50\/80,
        body.style-cyber .bg-pink-50\/50,
        body.style-cyber .bg-\[\#fcf9f5\] {
            background-color: #0b1120 !important;
            border-color: rgba(56, 189, 248, 0.2) !important;
            color: #cbd5e1 !important;
        }
        body.style-cyber h1,
        body.style-cyber h2,
        body.style-cyber h3,
        body.style-cyber h4,
        body.style-cyber .text-\[\#4a3b32\],
        body.style-cyber .text-\[\#594a42\] {
            color: #f8fafc !important;
        }
        body.style-cyber .text-\[\#736054\],
        body.style-cyber .text-\[\#8c776c\],
        body.style-cyber .text-\[\#a69286\] {
            color: #94a3b8 !important;
        }
        body.style-cyber #openAddItemModal,
        body.style-cyber button[type="submit"] {
            background: linear-gradient(90deg, #0284c7, #6366f1) !important;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4) !important;
        }
        body.style-cyber nav {
            background-color: rgba(11, 17, 32, 0.95) !important;
            border-color: rgba(56, 189, 248, 0.3) !important;
        }
        body.style-cyber .bg-gradient-to-t {
            background: linear-gradient(to top, #0f172a, rgba(15, 23, 42, 0.9), transparent) !important;
        }

        /* =========================================
           6. 🍵 日系和風抹茶 (Japanese Matcha)
           ========================================= */
        body.style-matcha {
            --accent-color: #4d7c0f;
            --accent-light: #ecfccb;
            --bg-color: #eef2e6;
            --card-radius: 0.75rem;
            --app-radius: 22px;
            --card-border: 1.5px solid #bef264;
            --card-shadow: 0 4px 12px rgba(77, 124, 15, 0.08);
            --font-main: 'Noto Serif TC', serif;
        }
        body.style-matcha #app {
            background-color: #f9fbf7 !important;
            border: 2px solid #a3b18a !important;
        }
        body.style-matcha header {
            background: linear-gradient(135deg, #dce6d2 0%, #eef4e8 100%) !important;
            border-bottom: 1.5px solid #a3b18a !important;
            border-radius: 0 !important;
        }
        body.style-matcha #openAddItemModal,
        body.style-matcha button[type="submit"] {
            background: #588157 !important;
            color: #ffffff !important;
        }
        body.style-matcha nav {
            background-color: #f3f7ef !important;
            border-top: 1px solid #a3b18a !important;
        }

        /* =========================================
           7. 🪟 夢幻毛玻璃 (Dreamy Glassmorphism)
           ========================================= */
        body.style-glass {
            --accent-color: #7c3aed;
            --accent-light: rgba(255, 255, 255, 0.65);
            --bg-color: #e0e7ff;
            --card-radius: 1.5rem;
            --app-radius: 36px;
            --card-border: 1px solid rgba(255, 255, 255, 0.8);
            --card-shadow: 0 8px 24px rgba(124, 58, 237, 0.1);
            --font-main: 'Quicksand', 'Noto Sans TC', sans-serif;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 50%, #fbc2eb 100%) !important;
        }
        body.style-glass #app {
            background: rgba(255, 255, 255, 0.55) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.85) !important;
        }
        body.style-glass header {
            background: rgba(255, 255, 255, 0.35) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-radius: 0 !important;
        }
        body.style-glass #itemList > div,
        body.style-glass .settings-card {
            background: rgba(255, 255, 255, 0.65) !important;
            backdrop-filter: blur(12px) !important;
        }
        body.style-glass nav {
            background: rgba(255, 255, 255, 0.75) !important;
            backdrop-filter: blur(16px) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.8) !important;
        }

        /* =========================================
           8. 🍰 復古法式奶油 (French Vintage Cream)
           ========================================= */
        body.style-french {
            --accent-color: #9f1239;
            --accent-light: #ffe4e6;
            --bg-color: #fdf6e9;
            --card-radius: 1.1rem;
            --app-radius: 30px;
            --card-border: 1.5px solid #e7d7c1;
            --card-shadow: 0 5px 15px rgba(159, 18, 57, 0.06);
            --font-main: 'Noto Serif TC', Georgia, serif;
        }
        body.style-french #app {
            background-color: #fffcf5 !important;
            border: 2px solid #e7d7c1 !important;
        }
        body.style-french header {
            background: linear-gradient(180deg, #fae8d4 0%, #fffcf5 100%) !important;
            border-bottom: 1.5px solid #e7d7c1 !important;
        }
        body.style-french #openAddItemModal,
        body.style-french button[type="submit"] {
            background: #9f1239 !important;
            color: #fffcf5 !important;
        }

        /* =========================================
           9. 🌊 蔚藍海洋度假 (Ocean Breeze Resort)
           ========================================= */
        body.style-ocean {
            --accent-color: #0284c7;
            --accent-light: #e0f2fe;
            --bg-color: #e0f7fa;
            --card-radius: 1.25rem;
            --app-radius: 32px;
            --card-border: 1.5px solid #bae6fd;
            --card-shadow: 0 6px 18px rgba(2, 132, 199, 0.08);
            --font-main: 'Quicksand', 'Noto Sans TC', sans-serif;
        }
        body.style-ocean header {
            background: linear-gradient(135deg, #bae6fd 0%, #cffafe 60%, #fef9c3 100%) !important;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
        }
        body.style-ocean #openAddItemModal,
        body.style-ocean button[type="submit"] {
            background: linear-gradient(90deg, #0284c7, #06b6d4) !important;
            color: #ffffff !important;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: #594a42;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #app {
            border-radius: var(--app-radius);
            transition: all 0.35s ease;
        }

        #itemList > div,
        #viewSettings > div.settings-card,
        header > div.bg-white\/70,
        header > div.bg-white\/80 {
            border-radius: var(--card-radius) !important;
            border: var(--card-border) !important;
            box-shadow: var(--card-shadow) !important;
            transition: all 0.3s ease;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f0e6dc;
            border-radius: 10px;
        }

        .theme-accent-bg {
            background-color: var(--accent-color);
        }
        .theme-accent-text {
            color: var(--accent-color);
        }
        .theme-accent-light-bg {
            background-color: var(--accent-light);
        }
    </style>
</head>
<body class="style-cute min-h-screen pb-16 sm:pb-6">
    <!-- Main App Container -->
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen sm:min-h-[820px] sm:my-4 shadow-xl relative flex flex-col overflow-hidden">
        
        <!-- VIEW 1: SHOPPING LIST -->
        <div id="viewList" class="flex-1 flex flex-col overflow-hidden">
            <!-- Header Section -->
            <header class="p-4 pt-5 space-y-3 shrink-0 transition-all">
                <!-- Top Bar: Trip Selector & Currency -->
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <button id="toggleTripDropdownBtn" class="flex items-center gap-1.5 text-left group min-w-0">
                            <h1 id="currentTripTitle" class="text-base font-extrabold text-[#4a3b32] truncate">🇯🇵 東京血拼行</h1>
                            <i id="tripDropdownArrow" class="fa-solid fa-chevron-down text-[10px] theme-accent-text transition-transform"></i>
                        </button>
                        <button id="openEditTripModal" title="編輯行程名稱" class="w-6 h-6 rounded-full bg-white/70 hover:bg-white flex items-center justify-center text-[#8c776c] hover:theme-accent-text transition shrink-0">
                            <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0">
                        <span id="tripCountBadge" class="text-[10px] font-bold text-[#8c776c] bg-white/60 px-2 py-1 rounded-lg">1 個行程</span>
                        <button id="openCurrencyModal" class="bg-white/85 hover:bg-white px-2.5 py-1 rounded-xl text-xs font-extrabold theme-accent-text shadow-sm flex items-center gap-1 transition">
                            <span id="currentCurrencySymbol">￥</span>
                            <span id="currentCurrencyCode">JPY</span>
                        </button>
                    </div>
                </div>

                <!-- Horizontal Trip Pills + Add Trip -->
                <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-0.5">
                    <div id="tripTabsContainer" class="flex items-center gap-1.5"></div>
                    <button id="openAddTripModal" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-white theme-accent-text whitespace-nowrap flex items-center gap-1 border border-dashed border-pink-300 transition shrink-0">
                        <i class="fa-solid fa-plus text-[10px]"></i> 新增旅行
                    </button>
                </div>

                <!-- Expandable Trip Grid -->
                <div id="tripGridExpanded" class="hidden grid grid-cols-2 gap-2 pt-1"></div>

                <!-- Budget & Tax Summary Card -->
                <div class="bg-white/80 backdrop-blur-sm p-3 rounded-2xl space-y-2">
                    <div class="flex justify-between items-center text-[11px]">
                        <span class="text-[#8c776c] font-bold">稅前花費 (已購/總計)</span>
                        <span id="totalPreTaxText" class="font-extrabold text-[#594a42]">￥0 / ￥0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="theme-accent-text font-extrabold">稅後花費 (已購/總計)</span>
                        <div class="text-right">
                            <span id="totalPostTaxText" class="font-extrabold theme-accent-text">￥0 / ￥0</span>
                            <div id="totalHomeCurrencyText" class="text-[10px] font-bold text-[#8c776c] hidden">≈ HK$0 / HK$0</div>
                        </div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="flex items-center gap-2 pt-0.5">
                        <div class="flex-1 h-2 bg-orange-100/80 rounded-full overflow-hidden">
                            <div id="progressBar" class="h-full theme-accent-bg transition-all duration-300 rounded-full" style="width: 0%"></div>
                        </div>
                        <span id="progressText" class="text-[10px] font-bold text-[#8c776c]">0/0</span>
                    </div>
                </div>
            </header>

            <!-- Filters Area: Search, Persons & Categories -->
            <div class="px-4 pt-3 pb-1 space-y-2.5 shrink-0">
                <!-- Search & Hide Bought Bar -->
                <div class="flex items-center gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass text-[11px] text-[#a69286] absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="searchInput" placeholder="搜尋商品名稱或店鋪備註..." class="w-full bg-orange-50/60 border border-orange-100/80 rounded-xl pl-8 pr-7 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pink-300 text-[#594a42]">
                        <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[#a69286] hover:text-[#594a42] text-xs">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                    <button id="toggleHideBoughtBtn" onclick="toggleHideBought()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-orange-50/70 hover:bg-orange-100 text-[#736054] border border-orange-100/80 whitespace-nowrap flex items-center gap-1 transition shrink-0">
                        <i id="hideBoughtIcon" class="fa-regular fa-eye"></i>
                        <span id="hideBoughtText">全部</span>
                    </button>
                </div>

                <!-- Person Filter Row -->
                <div class="space-y-1">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] font-bold text-[#8c776c]">誰的購物清單</span>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleManagePersons()" class="text-[10px] font-bold text-[#8c776c] hover:theme-accent-text transition">
                                <i class="fa-solid fa-sliders mr-0.5"></i><span id="managePersonBtnText">管理</span>
                            </button>
                            <button id="openAddPersonModal" class="text-[10px] font-bold theme-accent-text hover:opacity-80 transition">
                                <i class="fa-solid fa-plus mr-0.5"></i>新增人物
                            </button>
                        </div>
                    </div>
                    <div id="personTabsContainer" class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1"></div>
                </div>

                <!-- Category Filter Row -->
                <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                    <div id="categoryFilterContainer" class="flex items-center gap-1.5"></div>
                    <button id="openAddCategoryModal" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-orange-50/70 hover:bg-orange-100 theme-accent-text whitespace-nowrap flex items-center gap-1 shrink-0 transition">
                        <i class="fa-solid fa-plus text-[10px]"></i> 分類
                    </button>
                </div>
            </div>

            <!-- Main Item List -->
            <main id="itemList" class="flex-1 overflow-y-auto custom-scrollbar px-4 py-2 space-y-2.5 pb-24">
                <!-- Items rendered dynamically -->
            </main>

            <!-- Add Item Button -->
            <div class="p-4 pb-16 bg-gradient-to-t from-white via-white/90 to-transparent sticky bottom-0 z-10">
                <button id="openAddItemModal" class="w-full bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 hover:opacity-95 text-white font-bold py-3 px-4 rounded-2xl shadow-md shadow-pink-200/50 active:scale-[0.98] transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-sparkles"></i>
                    <span>新增購物項目</span>
                </button>
            </div>
        </div>

        <!-- VIEW 2: SETTINGS -->
        <div id="viewSettings" class="flex-1 p-5 pb-24 overflow-y-auto custom-scrollbar space-y-5 hidden">
            <div class="pt-1">
                <h2 class="text-lg font-extrabold text-[#4a3b32] flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles theme-accent-text"></i> 應用程式設定
                </h2>
                <p class="text-xs text-[#8c776c] mt-0.5">自訂專屬整體設計風格、分類順序與資料備份</p>
            </div>

            <!-- Section 1: Overall Aesthetic Styles -->
            <div class="settings-card bg-white p-4 rounded-2xl border border-orange-100/80 space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-extrabold text-[#4a3b32] flex items-center gap-1.5">
                        <i class="fa-solid fa-palette theme-accent-text"></i> 整體介面美學風格
                    </h3>

        function loadState() {
            const saved = localStorage.getItem('cute_travel_multitrip_shopping_app_v2');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) {
                    console.error('Failed to parse state:', e);
                }
            }
            state.trips.forEach(trip => {
                if (!trip.persons) {
                    trip.persons = [
                        { id: 'all', name: '全部人物' },
                        { id: 'me', name: '👧 我自己' }
                    ];
                }
                if (!trip.selectedPerson) {
                    trip.selectedPerson = 'all';
                }
                if (!trip.categories) {
                    trip.categories = [
                        { id: 'all', name: '全部分類', icon: 'fa-border-all' },
                        { id: 'beauty', name: '美妝藥妝', icon: 'fa-capsules' }
                    ];
                }
                if (!trip.selectedCategory) {
                    trip.selectedCategory = 'all';
                }
            });

            if (!state.trips.some(t => t.id === state.currentTripId) && state.trips.length > 0) {
                state.currentTripId = state.trips[0].id;

            if (!state.theme || !state.theme.startsWith('style-')) {
                state.theme = 'style-cute';

            setTheme(state.theme);

            toggleModal('customConfirmModal', true);

        function compressImageFile(file, maxWidth = 420, quality = 0.72) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function openLightbox(itemId) {
            const trip = getCurrentTrip();
            const item = trip.items.find(i => i.id === itemId);
            if (!item || !item.image) return;
            document.getElementById('lightboxImg').src = item.image;
            document.getElementById('lightboxTitle').innerText = item.name;
            const postPrice = item.pricePostTax !== undefined && item.pricePostTax !== '' ? Number(item.pricePostTax) : (Number(item.price) || 0);
            document.getElementById('lightboxMeta').innerText = `稅後單價: ${trip.currency.symbol}${postPrice.toLocaleString()} ｜ 數量: ${item.qty}${item.note ? ' ｜ ' + item.note : ''}`;
            toggleModal('imageLightboxModal', true);
        }

        function getCurrentTrip() {
            return state.trips.find(t => t.id === state.currentTripId) || state.trips[0];
        }

        function setTheme(themeName) {
            state.theme = themeName;
            document.body.className = `${themeName} min-h-screen pb-16 sm:pb-6`;
            
            document.querySelectorAll('.style-check-icon').forEach(icon => icon.classList.add('hidden'));
            const activeBtn = document.getElementById(`btn-${themeName}`);
            if (activeBtn) {
                const checkIcon = activeBtn.querySelector('.style-check-icon');
                if (checkIcon) checkIcon.classList.remove('hidden');
            }
            
            saveState();
        }

        function switchMainTab(tab) {
            state.activeTab = tab;
            ['list', 'settings'].forEach(t => {
                const view = document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`);
                const btn = document.getElementById(`navBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (t === tab) {
                    view.classList.remove('hidden');
                    btn.className = 'flex flex-col items-center gap-0.5 theme-accent-text font-bold transition';
                } else {
                    view.classList.add('hidden');
                    btn.className = 'flex flex-col items-center gap-0.5 text-[#a69286] font-medium hover:text-[#594a42] transition';
                }
            });
            if (tab === 'settings') {
                renderSettingsCategoryOrder();
            }
        }

        function renderSettingsCategoryOrder() {
            const trip = getCurrentTrip();
            const container = document.getElementById('settingsCategoryOrderList');
            if (!container) return;

            const sortableCategories = trip.categories.filter(c => c.id !== 'all');
            container.innerHTML = sortableCategories.map((cat, idx) => `
                <div class="flex items-center justify-between bg-orange-50/50 px-3 py-2 rounded-xl border border-orange-100/60">
                    <div class="flex items-center gap-2 text-xs font-bold text-[#594a42]">
                        <i class="fa-solid ${cat.icon} theme-accent-text w-4 text-center"></i>
                        <span>${cat.name}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="moveCategory(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} class="w-6 h-6 rounded-lg bg-white border border-orange-100 flex items-center justify-center text-[10px] text-[#736054] disabled:opacity-30 hover:theme-accent-text transition">
                            <i class="fa-solid fa-chevron-up"></i>
                        </button>
                        <button onclick="moveCategory(${idx}, 1)" ${idx === sortableCategories.length - 1 ? 'disabled' : ''} class="w-6 h-6 rounded-lg bg-white border border-orange-100 flex items-center justify-center text-[10px] text-[#736054] disabled:opacity-30 hover:theme-accent-text transition">
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        ${sortableCategories.length > 1 ? `
                            <button onclick="deleteCategory('${cat.id}')" title="刪除分類" class="w-6 h-6 rounded-lg bg-white border border-orange-100 flex items-center justify-center text-[10px] text-rose-400 hover:bg-rose-50 hover:text-rose-600 transition ml-0.5">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function deleteCategory(catId) {
            const trip = getCurrentTrip();
            const sortable = trip.categories.filter(c => c.id !== 'all');
            if (sortable.length <= 1) return;

            trip.categories = trip.categories.filter(c => c.id !== catId);
            const fallbackCat = trip.categories.find(c => c.id !== 'all');
            trip.items.forEach(item => {
                if (item.category === catId) {
                    item.category = fallbackCat ? fallbackCat.id : 'all';
                }
            });
            if (trip.selectedCategory === catId) {
                trip.selectedCategory = 'all';
            }
            saveState();
            renderCategories();
            renderItems();
            renderSettingsCategoryOrder();
        }

        function moveCategory(sortableIndex, direction) {
            const trip = getCurrentTrip();
            const allCat = trip.categories.find(c => c.id === 'all');
            const sortable = trip.categories.filter(c => c.id !== 'all');
            const targetIndex = sortableIndex + direction;
            if (targetIndex < 0 || targetIndex >= sortable.length) return;

            const temp = sortable[sortableIndex];
            sortable[sortableIndex] = sortable[targetIndex];
            sortable[targetIndex] = temp;

            trip.categories = allCat ? [allCat, ...sortable] : sortable;
            saveState();
            renderCategories();
            renderSettingsCategoryOrder();
        }

        function deletePerson(personId, event) {
            if (event) event.stopPropagation();
            if (personId === 'all') return;

            const trip = getCurrentTrip();
            if (trip.persons.length <= 2) {
                return;
            }

            trip.persons = trip.persons.filter(p => p.id !== personId);
            
            const fallbackPersonId = trip.persons[1] ? trip.persons[1].id : '';
            trip.items.forEach(item => {
                if (item.person === personId) {
                    item.person = fallbackPersonId;
                }
            });

            if (trip.selectedPerson === personId) {
                trip.selectedPerson = 'all';
            }

            saveState();
            renderPersons();
            renderItems();
        }

        function renderHeaderStats() {
            const trip = getCurrentTrip();
            document.getElementById('currentTripTitle').innerText = trip.name;
            document.getElementById('currentCurrencySymbol').innerText = trip.currency.symbol;

            document.querySelectorAll('.currencySymbolText').forEach(el => el.innerText = trip.currency.symbol);

            const totalPreTax = trip.items.reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.qty) || 1), 0);
            const boughtPreTax = trip.items
                .filter(item => item.bought)
                .reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.qty) || 1), 0);

            const totalPostTax = trip.items.reduce((sum, item) => {
                const postPrice = item.pricePostTax !== undefined && item.pricePostTax !== '' ? Number(item.pricePostTax) : (Number(item.price) || 0);
                return sum + postPrice * (Number(item.qty) || 1);
            }, 0);
            const boughtPostTax = trip.items
                .filter(item => item.bought)
                .reduce((sum, item) => {
                    const postPrice = item.pricePostTax !== undefined && item.pricePostTax !== '' ? Number(item.pricePostTax) : (Number(item.price) || 0);
                    return sum + postPrice * (Number(item.qty) || 1);
                }, 0);

            document.getElementById('totalPreTaxText').innerText = `${trip.currency.symbol}${boughtPreTax.toLocaleString()} / ${trip.currency.symbol}${totalPreTax.toLocaleString()}`;
            document.getElementById('totalPostTaxText').innerText = `${trip.currency.symbol}${boughtPostTax.toLocaleString()} / ${trip.currency.symbol}${totalPostTax.toLocaleString()}`;

            const homeCurrencyEl = document.getElementById('totalHomeCurrencyText');
            if (trip.exchangeRate && Number(trip.exchangeRate) > 0) {
                const rate = Number(trip.exchangeRate);
                const sym = trip.homeCurrencySymbol || 'HK$';
                const boughtHome = Math.round(boughtPostTax * rate);
                const totalHome = Math.round(totalPostTax * rate);
                homeCurrencyEl.innerText = `≈ ${sym}${boughtHome.toLocaleString()} / ${sym}${totalHome.toLocaleString()}`;
                homeCurrencyEl.classList.remove('hidden');
            } else {
                homeCurrencyEl.classList.add('hidden');
            }

            const totalCount = trip.items.length;
            const boughtCount = trip.items.filter(i => i.bought).length;
            const percent = totalCount > 0 ? Math.round((boughtCount / totalCount) * 100) : 0;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${boughtCount}/${totalCount}`;
        }

        function renderItems() {
            const trip = getCurrentTrip();
            const list = document.getElementById('itemList');
            let filtered = [...trip.items];

            if (trip.selectedPerson !== 'all') {
                filtered = filtered.filter(i => i.person === trip.selectedPerson);
            }

            if (trip.selectedCategory !== 'all') {
                filtered = filtered.filter(i => i.category === trip.selectedCategory);
            }

            if (state.hideBought) {
                filtered = filtered.filter(i => !i.bought);
            }

            if (state.searchQuery && state.searchQuery.trim() !== '') {
                const q = state.searchQuery.trim().toLowerCase();
                filtered = filtered.filter(i =>
                    (i.name && i.name.toLowerCase().includes(q)) ||
                    (i.note && i.note.toLowerCase().includes(q))
                );
            }

            filtered.sort((a, b) => {
                if (a.bought === b.bought) return 0;
                return a.bought ? 1 : -1;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-16 text-[#a69286]">
                        <div class="w-16 h-16 rounded-full bg-orange-50 flex items-center justify-center mx-auto mb-3 text-pink-300 text-xl">
                            <i class="fa-solid fa-basket-shopping"></i>
                        </div>
                        <p class="text-xs font-semibold">${state.searchQuery || state.hideBought ? '找不到符合條件的商品喔！' : '這份購物清單還沒有商品喔！'}</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(item => {
                const categoryObj = trip.categories.find(c => c.id === item.category);
                const categoryName = categoryObj ? categoryObj.name : '未分類';

                const personObj = trip.persons.find(p => p.id === item.person);
                const personName = personObj ? personObj.name : '';
                
                const preTaxPrice = Number(item.price) || 0;
                const postTaxPrice = item.pricePostTax !== undefined && item.pricePostTax !== '' ? Number(item.pricePostTax) : preTaxPrice;
                
                const itemPreTaxTotal = preTaxPrice * (Number(item.qty) || 1);
                const itemPostTaxTotal = postTaxPrice * (Number(item.qty) || 1);

                const hasRate = trip.exchangeRate && Number(trip.exchangeRate) > 0;
                const homeTotal = hasRate ? Math.round(itemPostTaxTotal * Number(trip.exchangeRate)) : 0;
                const homeSym = trip.homeCurrencySymbol || 'HK$';

                return `
                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-orange-100/60 flex gap-3.5 items-center transition hover:border-pink-200 ${item.bought ? 'opacity-60 bg-[#fcf9f5]/60' : ''}">
                        <button onclick="toggleBought('${item.id}')" class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition ${
                            item.bought 
                            ? 'theme-accent-bg border-transparent text-white shadow-sm' 
                            : 'border-orange-200 hover:border-pink-300 bg-white'
                        }">
                            ${item.bought ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                        </button>

                        <div ${item.image ? `onclick="openLightbox('${item.id}')"` : ''} title="${item.image ? '點擊放大檢視圖片' : ''}" class="w-16 h-16 rounded-2xl bg-orange-50 overflow-hidden shrink-0 border border-orange-100 flex items-center justify-center text-orange-200 relative shadow-inner ${item.image ? 'cursor-pointer group' : ''}">
                            ${item.image 
                                ? `<img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition" onerror="this.onerror=null;this.src='https://placehold.co/120x120/fef2f2/f472b6?text=✨';">
                                   <span class="absolute bottom-0.5 right-0.5 w-4 h-4 rounded-full bg-black/45 text-white flex items-center justify-center text-[8px] opacity-80"><i class="fa-solid fa-expand"></i></span>` 
                                : `<i class="fa-solid fa-image text-lg text-orange-300"></i>`
                            }
                        </div>

                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                                <span class="text-[10px] theme-accent-light-bg theme-accent-text px-2 py-0.5 rounded-md font-bold">${categoryName}</span>
                                ${personName ? `<span class="text-[10px] bg-orange-100/70 text-[#736054] px-1.5 py-0.5 rounded-md font-semibold"><i class="fa-solid fa-user text-[9px] mr-0.5"></i>${personName}</span>` : ''}
                                ${item.note ? `<span class="text-[10px] text-[#a69286] truncate max-w-[80px] font-medium"><i class="fa-solid fa-location-dot mr-0.5"></i>${item.note}</span>` : ''}
                            </div>
                            <h4 class="font-bold text-sm text-[#4a3b32] truncate ${item.bought ? 'line-through text-[#a69286]' : ''}">${item.name}</h4>
                            
                            <div class="mt-1.5 space-y-0.5 text-[11px]">
                                <div class="flex justify-between items-center text-[#8c776c]">
                                    <span>稅前: ${trip.currency.symbol}${preTaxPrice.toLocaleString()} × ${item.qty}</span>
                                    <span class="font-semibold">${trip.currency.symbol}${itemPreTaxTotal.toLocaleString()}</span>
                                </div>
                                <div class="flex justify-between items-center theme-accent-text font-bold">
                                    <span>稅後: ${trip.currency.symbol}${postTaxPrice.toLocaleString()} × ${item.qty}</span>
                                    <div class="text-right">
                                        <span class="text-xs font-extrabold">${trip.currency.symbol}${itemPostTaxTotal.toLocaleString()}</span>
                                        ${hasRate ? `<span class="block text-[9px] text-[#8c776c] font-semibold">≈ ${homeSym}${homeTotal.toLocaleString()}</span>` : ''}
                                    </div>

                            <button onclick="editItem('${item.id}')" class="p-1.5 text-[#a69286] hover:theme-accent-text transition">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteItem('${item.id}')" class="p-1.5 text-[#a69286] hover:text-rose-400 transition">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `travel_shopping_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && Array.isArray(imported.trips) && imported.trips.length > 0) {
                        state = { ...state, ...imported };
                        saveState();
                        setTheme(state.theme || 'style-cute');
                        renderTrips();
                        renderPersons();
                        renderHeaderStats();
                        renderCategories();
                        renderItems();
                        renderSettingsCategoryOrder();
                        showToast('匯入成功', '您的旅行購物清單備份已完整還原！');
                    } else {
                        showToast('檔案格式錯誤', '請選擇正確的購物清單 JSON 備份檔案。', 'fa-circle-xmark', 'bg-rose-50 text-rose-500');
                    }
                } catch (err) {
                    showToast('讀取失敗', '無法解析此備份檔案，請確認檔案未損壞。', 'fa-circle-xmark', 'bg-rose-50 text-rose-500');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            const content = modal.firstElementChild;
            if (show) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('translate-y-full');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                content.classList.add('translate-y-full');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 200);
            }
        }

                } else {
                    trip.items.push({
                        id, name, person, category, price, pricePostTax, qty, note, image, bought: false
                    });
                }

                saveState();
                renderHeaderStats();
                renderItems();
                toggleModal('itemModal', false);
            };

            document.getElementById('categoryForm').onsubmit = (e) => {
                e.preventDefault();
                const name = document.getElementById('newCategoryName').value.trim();
                if (!name) return;

                const trip = getCurrentTrip();
                const id = 'cat_' + Date.now();
                trip.categories.push({
                    id,
                    name,
                    icon: state.selectedCategoryIcon || 'fa-tag'
                });

                saveState();
                renderCategories();
                renderSettingsCategoryOrder();
                toggleModal('categoryModal', false);
                document.getElementById('newCategoryName').value = '';
            };
        });
    </script>
</body>
</html>
